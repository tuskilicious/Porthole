name: Release

# Push a tag like v0.1.0 to build, test, sign (via SignPath) and publish a GitHub Release.
# Signing only runs when the SIGNPATH_API_TOKEN secret exists; without it the release still goes
# out, but unsigned, and says so. See "Code signing policy" in the README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build USBControl.sln -c Release --nologo

      - name: Test
        run: dotnet test tests/USBControl.Tests/USBControl.Tests.csproj -c Release --no-build --nologo

      - name: Publish single-file exe
        run: >
          dotnet publish src/USBControl.App/USBControl.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --nologo

      - name: Upload unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: porthole-unsigned
          path: publish/Porthole.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: porthole
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $signed = $env:SIGNPATH_TOKEN -ne ''
          $src = if ($signed) { 'signed\Porthole.exe' } else { 'publish\Porthole.exe' }
          $name = "Porthole-$($env:GITHUB_REF_NAME)-win-x64.exe"
          Copy-Item $src "release\$name"
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "release\$name.sha256" -Encoding ascii
          if ($signed) { Get-AuthenticodeSignature "release\$name" | Format-List Status, SignerCertificate }
          "SIGNED=$signed" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $note = if ($env:SIGNED -eq 'True') { 'Code-signed via SignPath Foundation.' } else { '**Unsigned build** - Windows SmartScreen will warn.' }
          gh release create $env:GITHUB_REF_NAME release/* --title $env:GITHUB_REF_NAME --notes "$note`n`nRead the README's safety section and undo steps before disabling devices. Test with a harmless device (webcam, spare drive) first."
